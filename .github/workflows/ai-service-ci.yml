name: ai-service CI

on:
  # PR에는 경로 필터를 걸지 않는다.
  # 이 job은 main의 required status check이므로, 경로 필터 때문에 실행되지 않으면
  # GitHub이 "대기 중" 상태로 두고 머지를 영구히 막는다. backend만 바꾼 PR도 통과시켜야 하므로
  # 항상 실행한다. 필터를 되살리려면 required check에서 먼저 빼야 한다.
  pull_request:
    branches: [main]
  # push는 머지 게이트가 아니므로 관련 경로가 바뀔 때만 돌린다.
  push:
    branches: [main]
    paths:
      - 'ai-service/**'
      - '.github/workflows/ai-service-ci.yml'

jobs:
  ai-service-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: uv 설정
        uses: astral-sh/setup-uv@v3
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: uv sync

      - name: 테스트
        run: uv run pytest
